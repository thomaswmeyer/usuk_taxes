[project]
name = "usuk-taxes"
version = "0.1.0"
description = "Research tool for US citizens living in the UK — cited answers from IRS, HMRC and US-UK treaty sources, plus a US return estimate to check your own tax software against"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "chromadb>=0.5.5",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.scripts]
usuk = "usuk_taxes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usuk_taxes"]
