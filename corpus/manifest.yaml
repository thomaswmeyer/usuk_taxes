# Corpus manifest — authoritative sources for the US/UK expat tax advisor.
#
# Scope: current filing year only —
#   US tax year 2025 (filed in 2026), UK tax year 2025-26 (SA due 31 Jan 2027).
# Selection is tailored to the household profile in profile.yaml:
#   UK employment income, US-parent stock options, UK rental income,
#   married with three dependent children.
#
# type: pdf | html
# jurisdiction: us | uk | treaty

sources:
  # ── Treaty layer (the crux for expat questions) ──────────────────────────
  - id: us-uk-treaty
    jurisdiction: treaty
    title: "US-UK Income Tax Convention (2001, as amended)"
    url: https://home.treasury.gov/system/files/131/Treaty-UK-7-24-2001.pdf
    type: pdf

  - id: us-uk-treaty-technical-explanation
    jurisdiction: treaty
    title: "Treasury Technical Explanation of the US-UK Income Tax Convention"
    url: https://home.treasury.gov/system/files/131/Treaty-UK-Protocol-TE-7-22-2002.pdf
    type: pdf

